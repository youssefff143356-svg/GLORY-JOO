<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN PANEL - GLORY JOO</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg-color: #0a0505; --card-bg: #140808; --primary-red: #e50914; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: #331111; --glow: 0 0 15px rgba(229, 9, 20, 0.5); }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 1200px; width: 100%; }
    
    .login-box { background: var(--card-bg); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-shadow: var(--glow); margin: 100px auto; text-align: center; }
    .login-box h1 { color: var(--primary-red); margin-bottom: 20px; }
    .input-group input { width: 100%; padding: 14px; background: #0a0505; border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 1rem; font-family: 'Cairo'; margin-bottom: 15px; }
    .btn-primary { width: 100%; padding: 15px; background: var(--primary-red); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { background: #ff0f1b; }

    #dashboard { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .top-bar h2 { color: var(--primary-red); }
    
    /* كارت رصيد API */
    .api-balance-card { background: rgba(251, 191, 36, 0.1); border: 1px solid #fbbf24; padding: 15px 25px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .api-balance-card h3 { color: #fbbf24; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
    .api-balance-card span { font-size: 1.3rem; }

    /* كروت الإحصائيات */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .kpi-card { background: var(--card-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .kpi-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(229, 9, 20, 0.1); color: var(--primary-red); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; }
    .kpi-info h4 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .kpi-info span { font-size: 1.5rem; font-weight: bold; color: white; }
    
    .card { background: var(--card-bg); border-radius: 20px; padding: 25px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .card h3 { font-size: 1.2rem; margin-bottom: 15px; color: #fbbf24; }

    .search-box { width: 100%; padding: 12px; background: #0a0505; border: 1px solid var(--border-color); border-radius: 10px; color: white; font-family: 'Cairo'; margin-bottom: 15px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { color: var(--text-muted); background: #0a0505; }
    .btn-sm { padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 0.8rem; transition: 0.3s; margin: 0 2px;}
    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: var(--primary-red); color: white; }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .status-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .status-banned { background: rgba(229, 9, 20, 0.2); color: var(--primary-red); }

    @media (max-width: 900px) { .kpi-grid { grid-template-columns: 1fr 1fr; } .api-balance-card { flex-direction: column; gap: 10px; text-align: center; } }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="login-box" id="loginBox">
      <h1><i class="fa-solid fa-lock"></i> ADMIN PANEL</h1>
      <div class="input-group"><input type="password" id="admin-pass" placeholder="أدخل باسورد الأدمن"></div>
      <button class="btn-primary" onclick="verifyAdmin()">دخول</button>
    </div>

    <div id="dashboard">
      <div class="top-bar">
        <h2><i class="fa-solid fa-shield-halved"></i> لوحة تحكم الإدارة</h2>
        <button class="btn-sm btn-red" onclick="window.location.reload()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>

      <!-- 🌟 كارت رصيد الموقع الأصلي (API) رجع تاني هنا -->
      <div class="api-balance-card">
        <h3><i class="fa-solid fa-server"></i> رصيد الموقع الأصلي (API)</h3>
        <div>
          <span id="admin-api-basic" style="color:#fff; font-weight:bold;">0</span> أساسي | 
          <span id="admin-api-premium" style="color:#fff; font-weight:bold;">0</span> مميز
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon"><i class="fa-solid fa-users"></i></div>
          <div class="kpi-info"><h4>إجمالي المسجلين</h4><span id="kpi-users">0</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background: rgba(34, 197, 94, 0.1); color: #22c55e;"><i class="fa-solid fa-wifi"></i></div>
          <div class="kpi-info"><h4>المتصلين حالياً</h4><span id="kpi-online">0</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background: rgba(156, 163, 175, 0.1); color: #9ca3af;"><i class="fa-solid fa-plug-circle-xmark"></i></div>
          <div class="kpi-info"><h4>غير متصل</h4><span id="kpi-offline">0</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background: rgba(251, 191, 36, 0.1); color: #fbbf24;"><i class="fa-solid fa-list-check"></i></div>
          <div class="kpi-info"><h4>طلبات جديدة</h4><span id="kpi-pending">0</span></div>
        </div>
      </div>

      <div class="card">
        <h3><i class="fa-solid fa-money-bill-transfer"></i> طلبات الشحن</h3>
        <table id="admin-reqs-table"><thead><tr><th>اليوزر</th><th>المبلغ</th><th>الطريقة</th><th>المرجع</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody></tbody></table>
      </div>

      <div class="card">
        <h3><i class="fa-solid fa-users-gear"></i> إدارة المستخدمين</h3>
        <input type="text" id="search-user" class="search-box" placeholder="🔍 ابحث عن مستخدم بالاسم..." onkeyup="searchUsers()">
        <table id="admin-users-table">
          <thead><tr><th>اليوزر</th><th>الرصيد</th><th>الحالة</th><th>آخر تواجد</th><th>إجراءات</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h3><i class="fa-solid fa-bullhorn"></i> إرسال إشعار للجميع</h3>
        <div style="display:flex; gap:10px;">
          <input type="text" id="broadcast-msg" placeholder="اكتب الرسالة هنا..." style="flex:1; padding:12px; background:#0a0505; border:1px solid var(--border-color); border-radius:10px; color:white;">
          <button class="btn-primary" onclick="sendBroadcast()" style="width:150px;">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://ffglory-proxy.youssefff143356.workers.dev"; 
    let currentAdminPass = "";
    let allUsers = []; 

    async function apiCall(path, method = "GET", body = null) {
      const options = { method, headers: { "Content-Type": "application/json" } };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch(WORKER_URL + path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "حدث خطأ");
      return data;
    }

    function verifyAdmin() {
      currentAdminPass = document.getElementById("admin-pass").value;
      if(currentAdminPass === "010300") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadAdminData();
      } else alert("باسورد غلط");
    }

    async function loadAdminData() {
      // 🌟 جلب رصيد الـ API (اللي ضفناه دلوقتي)
      try {
        const apiBal = await apiCall("/api/admin/api-balance", "POST", { adminPass: currentAdminPass });
        document.getElementById("admin-api-basic").innerText = apiBal.basic;
        document.getElementById("admin-api-premium").innerText = apiBal.premium;
      } catch(e) { console.log("API Balance Error:", e); }

      // جلب الإحصائيات
      try {
        const stats = await apiCall("/api/admin/stats", "POST", { adminPass: currentAdminPass });
        document.getElementById("kpi-users").innerText = stats.totalUsers;
        document.getElementById("kpi-online").innerText = stats.onlineUsers;
        document.getElementById("kpi-offline").innerText = stats.offlineUsers;
        document.getElementById("kpi-pending").innerText = stats.pendingReqs;
      } catch(e) { console.log(e); }

      // جلب الطلبات
      try {
        const reqs = await apiCall("/api/admin/requests", "POST", { adminPass: currentAdminPass });
        let reqHtml = "";
        reqs.forEach(r => {
          let statusBadge = '';
          let actionBtn = '';

          if (r.status === 'pending') {
             statusBadge = '<span class="status-badge" style="background:rgba(251,191,36,0.2); color:#fbbf24;">قيد الانتظار</span>';
             actionBtn = `<button class="btn-sm btn-green" onclick="approveReq('${r.id}')">موافقة</button>
                          <button class="btn-sm btn-red" onclick="rejectReq('${r.id}')">إلغاء</button>`;
          } else if (r.status === 'approved') {
             statusBadge = '<span class="status-badge status-active">تمت الموافقة</span>';
             actionBtn = "-";
          } else {
             statusBadge = '<span class="status-badge" style="background:#444; color:#aaa;">ملغي</span>';
             actionBtn = "-";
          }

          let methodName = r.method === 'vodafone' ? 'فودافون' : 'بايننس';
          
          reqHtml += `<tr>
            <td>${r.username}</td>
            <td style="color:#22c55e; font-weight:bold;">$${r.amount}</td>
            <td>${methodName}</td>
            <td style="font-size:0.8rem; color:var(--text-muted);">${r.txid}</td>
            <td>${statusBadge}</td>
            <td>${actionBtn}</td>
          </tr>`;
        });
        document.querySelector("#admin-reqs-table tbody").innerHTML = reqHtml || "<tr><td colspan='6' style='text-align:center;'>لا توجد طلبات</td></tr>";
      } catch(e) { console.log(e); }

      // جلب المستخدمين
      try {
        allUsers = await apiCall("/api/admin/users", "POST", { adminPass: currentAdminPass });
        renderUsersTable(allUsers); 
      } catch(e) { console.log(e); }
    }

    function renderUsersTable(usersToRender) {
      let userHtml = "";
      usersToRender.forEach(u => {
        let statusBadge = u.isBanned ? '<span class="status-badge status-banned">محظور</span>' : '<span class="status-badge status-active">نشط</span>';
        let banBtn = u.isBanned ? `<button class="btn-sm btn-green" onclick="userAction('${u.username}', 'unban')">إلغاء الحظر</button>` : `<button class="btn-sm btn-red" onclick="userAction('${u.username}', 'ban')">حظر</button>`;
        
        let lastSeenStr = "غير متصل";
        if (u.last_seen && (Date.now() - u.last_seen < 15 * 60 * 1000)) {
            lastSeenStr = "<span style='color:#22c55e;'>متصل الآن</span>";
        }

        userHtml += `<tr>
          <td><strong>${u.username}</strong></td>
          <td style="color:#fbbf24; font-weight:bold;">${u.balance}</td>
          <td>${statusBadge}</td>
          <td style="font-size:0.8rem;">${lastSeenStr}</td>
          <td>
            <button class="btn-sm btn-green" onclick="promptAdd('${u.username}', 'add')">+</button>
            <button class="btn-sm btn-red" onclick="promptAdd('${u.username}', 'deduct')">-</button>
            ${banBtn}
            <button class="btn-sm btn-red" onclick="deleteUser('${u.username}')" style="background:#7f1d1d;"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>`;
      });
      document.querySelector("#admin-users-table tbody").innerHTML = userHtml || "<tr><td colspan='5' style='text-align:center;'>لا يوجد مستخدمين</td></tr>";
    }

    function searchUsers() {
      const query = document.getElementById("search-user").value.toLowerCase();
      const filtered = allUsers.filter(u => u.username.toLowerCase().includes(query));
      renderUsersTable(filtered);
    }

    async function approveReq(reqId) {
      try {
        await apiCall("/api/admin/approve-req", "POST", { adminPass: currentAdminPass, reqId });
        alert("✅ تمت الموافقة وإضافة الرصيد للعميل!");
        loadAdminData(); 
      } catch(e) { alert("❌ حدث خطأ: " + e.message); }
    }

    async function rejectReq(reqId) {
      if(!confirm("هل أنت متأكد من إلغاء هذا الطلب؟")) return;
      try {
        await apiCall("/api/admin/reject-req", "POST", { adminPass: currentAdminPass, reqId });
        alert("✅ تم إلغاء الطلب بنجاح!");
        loadAdminData(); 
      } catch(e) { alert("❌ حدث خطأ: " + e.message); }
    }

    async function userAction(user, action, amount = 0) {
      try {
        await apiCall("/api/admin/user-action", "POST", { adminPass: currentAdminPass, targetUser: user, action, amount });
        loadAdminData();
      } catch(e) { alert("❌ حدث خطأ: " + e.message); }
    }

    function promptAdd(user, action) {
      let amount = prompt("أدخل المبلغ:");
      if(amount && !isNaN(amount)) userAction(user, action, parseFloat(amount));
    }

    async function deleteUser(username) {
      if(!confirm(`هل أنت متأكد من حذف المستخدم ${username} نهائياً؟`)) return;
      try {
        await apiCall("/api/admin/delete-user", "POST", { adminPass: currentAdminPass, targetUser: username });
        alert("🗑️ تم حذف المستخدم بنجاح!");
        loadAdminData();
      } catch(e) { alert("❌ حدث خطأ: " + e.message); }
    }

    async function sendBroadcast() {
      const msg = document.getElementById("broadcast-msg").value;
      if(!msg) return;
      try {
        await apiCall("/api/admin/broadcast", "POST", { adminPass: currentAdminPass, message: msg });
        alert("✅ تم إرسال الإشعار للجميع!");
        document.getElementById("broadcast-msg").value = "";
      } catch(e) { alert("❌ حدث خطأ: " + e.message); }
    }
  </script>
</body>
</html>
